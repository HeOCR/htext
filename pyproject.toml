[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "htext"
version = "0.1.0"
description = "Public-domain Hebrew text corpora, with per-entry Israel/US rights, for HeOCR training"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [
  { name = "HeOCR" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
]
# The no-loss wrap check renders with the generator's own code and fonts.
# Pillow must be built with libraqm (see .github/workflows/ci.yml).
fit = [
  "hocrsyngen @ git+https://github.com/HeOCR/hocrsyngen@88c61af4c12cc4a462fc1f57a1c4027b3459366d",
  "Pillow>=10",
]

[project.scripts]
htext = "htext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
