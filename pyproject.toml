[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "htext"
version = "0.1.0"
description = "Hebrew text corpora with per-entry rights records for HeOCR training"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [
  { name = "HeOCR maintainers" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
]
# The no-loss wrap check renders with the generator's own code and fonts.
# Pillow must be built with libraqm (see .github/workflows/ci.yml).
fit = [
  "hocrsyngen @ git+https://github.com/HeOCR/hocrsyngen@88c61af4c12cc4a462fc1f57a1c4027b3459366d",
  "Pillow>=10",
]
# The Wikisource builder parses ProofreadPage wikitext.
wikisource = [
  "mwparserfromhell==0.7.2",
]
# The knesset-plenary builder: hocrgen's plenary paragraph rules and its private-names gate (plenary_private_names_v1).
plenary = [
  "hocrgen @ git+https://github.com/HeOCR/hocrgen@f44a9aa6640a7a29ae8b9cdbcb20e0bcdeed54ce",
]

[project.scripts]
htext = "htext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
